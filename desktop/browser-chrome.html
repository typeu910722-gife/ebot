<!doctype html>
<meta charset="utf-8">
<title>瀏覽器</title>
<style>
  html, body { margin: 0; height: 100%; background: #1c1814; color: #f3ead3; font-family: "Segoe UI", "PingFang TC", sans-serif; }
  button { all: unset; box-sizing: border-box; display: block; width: 100%; height: 100%; cursor: pointer; position: relative; }
  img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; background: #1c1814; }
  .cap { position: absolute; left: 8px; right: 8px; bottom: 8px; display: flex; justify-content: space-between; gap: 6px; align-items: center; }
  .name { background: rgba(28, 24, 20, .86); border-radius: 999px; padding: 3px 8px; font-size: 12px; }
  .bar { display: none; height: 100%; align-items: center; justify-content: space-between; padding: 0 12px; gap: 12px; }
  body.open img, body.open .cap { display: none; }
  body.open .bar { display: flex; }
  .back { border: 1px solid #c4a574; border-radius: 999px; padding: 4px 12px; font-size: 12px; color: #e7d3a1; }
</style>
<body>
  <button id="hit" type="button" aria-label="打開瀏覽器">
    <img id="pic" alt="">
    <span class="cap"><span class="name" id="name">瀏覽器</span><span class="name">打開</span></span>
    <span class="bar"><span id="name2">瀏覽器</span><span class="back">收回</span></span>
  </button>
  <script>
    const hit = document.getElementById('hit');
    const pic = document.getElementById('pic');
    const name = document.getElementById('name');
    const name2 = document.getElementById('name2');
    hit.onclick = () => window.octaBrowser && window.octaBrowser.toggle();
    if (window.octaBrowser) window.octaBrowser.onFrame(d => {
      document.body.classList.toggle('open', d.mode === 'open');
      hit.setAttribute('aria-label', d.mode === 'open' ? '收回瀏覽器' : '打開瀏覽器');
      if (d.name) { name.textContent = d.name; name2.textContent = d.name; }
      if (d.jpeg) pic.src = 'data:image/jpeg;base64,' + d.jpeg;
    });
  </script>
</body>
