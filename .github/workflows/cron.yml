name: Routine timer

# Fires 例行任務 on time (雲端排程) even when no one has OCTA open, and tidies up old data.
# Set the repository variable OCTA_URL if your site is not octa.yzprojecttw.com.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: curl -fsS --max-time 60 "${{ vars.OCTA_URL || 'https://octa.yzprojecttw.com' }}/api/cron"
